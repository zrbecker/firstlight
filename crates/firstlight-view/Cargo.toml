[package]
name = "firstlight-view"
description = "egui desktop application for FirstLight: live view, focus, capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["astronomy", "camera", "egui", "astrophotography", "capture"]
categories = ["gui", "science"]

[[bin]]
name = "firstlight"
path = "src/main.rs"

[features]
default = ["simulator"]
simulator = ["firstlight-core/simulator"]
# Talk to real hardware. The Touptek SDK must be installed by hand (see
# crates/firstlight-touptek/vendor/README.md); the SVBONY SDK is downloaded
# automatically by its build script.
touptek = ["firstlight-touptek/sdk"]
svbony = ["firstlight-svbony/sdk"]

[dependencies]
firstlight-core.workspace = true
firstlight-svbony.workspace = true
firstlight-touptek.workspace = true
crossbeam-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eframe = "0.36"
egui = "0.36"
