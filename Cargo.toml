[workspace]
resolver = "3"
members = [
    "crates/firstlight-core",
    "crates/firstlight-svbony",
    "crates/firstlight-touptek",
    "crates/firstlight-cli",
    "crates/firstlight-view",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/zrbecker/firstlight"

[workspace.dependencies]
firstlight-core = { path = "crates/firstlight-core", version = "0.1.0" }
firstlight-svbony = { path = "crates/firstlight-svbony", version = "0.1.0" }
firstlight-touptek = { path = "crates/firstlight-touptek", version = "0.1.0" }

crossbeam-channel = "0.5"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"

# A debug build still has to push a megapixel of image data around several
# times a second. At opt-level 0 that costs over a hundred milliseconds a
# frame, which makes the application feel broken when the only thing wrong is
# the profile. Optimise dependencies and the pixel-handling crate while
# leaving the application crates debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.firstlight-core]
opt-level = 3
